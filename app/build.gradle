plugins {
    id 'com.android.application'
}

android {
    namespace 'com.monthlybudget.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.monthlybudget.app"
        minSdk 24
        targetSdk 35
        versionCode = (System.getenv("WAFFERLI_VERSION_CODE") ?: "90").toInteger()
        versionName = System.getenv("WAFFERLI_VERSION_NAME") ?: "1.9.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.5.0'
}
