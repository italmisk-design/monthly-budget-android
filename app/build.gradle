plugins {
    id 'com.android.application'
}

android {
    namespace 'com.monthlybudget.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.monthlybudget.app"
        minSdk 24
        targetSdk 35
        versionCode = (System.getenv("WAFFERLI_VERSION_CODE") ?: "3").toInteger()
        versionName = System.getenv("WAFFERLI_VERSION_NAME") ?: "1.2"
    }

    signingConfigs {
        wafferliTest {
            storeFile file("../tools/wafferli-test.keystore")
            storePassword "WafferliTest2026"
            keyAlias "wafferli"
            keyPassword "WafferliTest2026"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.wafferliTest
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
