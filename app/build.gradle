plugins {
    id 'com.android.application'
}

android {
    namespace 'com.monthlybudget.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.monthlybudget.app"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
