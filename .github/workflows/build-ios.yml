name: Build Wafferli iOS

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore official Wafferli logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          s = ''.join((Path('tools/logo_parts') / f'part{i}.txt').read_text(encoding='utf-8').strip() for i in range(1,6))
          data = base64.b64decode(s)
          Path('app/src/main/assets/wafferli_logo.jpg').write_bytes(data)
          Path('app/src/main/res/drawable/wafferli_logo.jpg').write_bytes(data)
          PY

      - name: Apply monthly confirmation patch
        run: python3 tools/patch_monthly_confirm.py

      - name: Apply monthly funding patch
        run: python3 tools/patch_monthly_funding.py

      - name: Apply monthly transfer patch
        run: python3 tools/patch_monthly_transfer.py

      - name: Improve category manager
        run: python3 tools/patch_category_manager.py

      - name: Add transaction filters
        run: python3 tools/patch_transaction_filters.py

      - name: Add balance sheet
        run: python3 tools/patch_balance_sheet.py

      - name: Add balance sheet transfer details
        run: python3 tools/patch_balance_transfers.py

      - name: Apply Wafferli logo
        run: python3 tools/patch_logo.py

      - name: Apply Wafferli brand name
        run: python3 tools/patch_brand_name.py

      - name: Make General Wallet real
        run: python3 tools/patch_real_general_wallet.py

      - name: Apply primary wallet hierarchy
        run: python3 tools/patch_primary_wallet_hierarchy.py

      - name: Apply full-screen safe area
        run: python3 tools/patch_safe_area.py

      - name: Add Google Drive backup UI
        run: python3 tools/patch_google_drive.py

      - name: Prepare iOS web assets
        run: |
          rm -rf ios/Tofeeri/WebAssets
          mkdir -p ios/Tofeeri/WebAssets
          cp -R app/src/main/assets/. ios/Tofeeri/WebAssets/

      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('ios/Tofeeri/WebAssets/index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', s, re.S)
          if not m:
              raise SystemExit('Inline script not found')
          Path('/tmp/wafferli-ios.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/wafferli-ios.js
          node --check ios/Tofeeri/WebAssets/primary_wallet.js

      - name: Create iOS app icons
        run: |
          python3 -m venv /tmp/wafferli-icon-venv
          /tmp/wafferli-icon-venv/bin/python -m pip install pillow
          /tmp/wafferli-icon-venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import json
          base = Path('ios/Tofeeri/Assets.xcassets/AppIcon.appiconset')
          base.mkdir(parents=True, exist_ok=True)
          def make_icon(px, filename):
              im = Image.new('RGB', (px, px), '#F7F5EE')
              d = ImageDraw.Draw(im)
              s = px / 1024.0
              def box(coords, radius, fill):
                  d.rounded_rectangle(tuple(int(v*s) for v in coords), radius=int(radius*s), fill=fill)
              d.ellipse((int(155*s), int(90*s), int(525*s), int(460*s)), fill='#D6A83B')
              d.ellipse((int(220*s), int(155*s), int(460*s), int(395*s)), outline='#F6E5A7', width=max(2,int(28*s)))
              box((180, 355, 900, 900), 130, '#0E6F5D')
              box((180, 355, 890, 590), 100, '#16836D')
              box((650, 560, 980, 820), 90, '#D6A83B')
              d.ellipse((int(775*s), int(655*s), int(840*s), int(720*s)), fill='#0B5F4F')
              d.rounded_rectangle((int(300*s), int(510*s), int(590*s), int(548*s)), radius=max(1,int(18*s)), fill='#E8C66B')
              im.save(base / filename, 'PNG')
          specs = [
              ('20x20','2x',40,'icon-40.png','iphone'),('20x20','3x',60,'icon-60.png','iphone'),
              ('29x29','2x',58,'icon-58.png','iphone'),('29x29','3x',87,'icon-87.png','iphone'),
              ('40x40','2x',80,'icon-80.png','iphone'),('40x40','3x',120,'icon-120.png','iphone'),
              ('60x60','2x',120,'icon-120-60.png','iphone'),('60x60','3x',180,'icon-180.png','iphone'),
              ('20x20','1x',20,'icon-ipad-20.png','ipad'),('20x20','2x',40,'icon-ipad-40.png','ipad'),
              ('29x29','1x',29,'icon-ipad-29.png','ipad'),('29x29','2x',58,'icon-ipad-58.png','ipad'),
              ('40x40','1x',40,'icon-ipad-40-1x.png','ipad'),('40x40','2x',80,'icon-ipad-80.png','ipad'),
              ('76x76','1x',76,'icon-76.png','ipad'),('76x76','2x',152,'icon-152.png','ipad'),
              ('83.5x83.5','2x',167,'icon-167.png','ipad'),('1024x1024','1x',1024,'icon-1024.png','ios-marketing')]
          seen=set()
          for _,_,px,fn,_ in specs:
              if fn not in seen:
                  make_icon(px,fn); seen.add(fn)
          images=[]
          for size,scale,px,fn,idiom in specs:
              images.append({'idiom':idiom,'size':size,'scale':scale,'filename':fn})
          (base/'Contents.json').write_text(json.dumps({'images':images,'info':{'version':1,'author':'xcode'}}, indent=2), encoding='utf-8')
          Path('ios/Tofeeri/Assets.xcassets/Contents.json').write_text(json.dumps({'info':{'version':1,'author':'xcode'}}, indent=2), encoding='utf-8')
          PY

      - name: Apply official Wafferli app icons
        run: /tmp/wafferli-icon-venv/bin/python tools/make_ios_icons.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          cd ios
          xcodebuild -project Tofeeri.xcodeproj -scheme Tofeeri -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package unsigned IPA
        run: |
          cd ios
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Tofeeri.app Payload/
          zip -qry Wafferli-iOS-Unsigned.ipa Payload

      - name: Package iOS source
        run: |
          cd ios
          zip -qr Wafferli-iOS-Source.zip . -x 'build/*' -x 'Payload/*' -x 'Wafferli-iOS-Unsigned.ipa' -x 'Wafferli-iOS-Source.zip'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wafferli-iOS-Unsigned
          path: ios/Wafferli-iOS-Unsigned.ipa
          if-no-files-found: error

      - name: Upload iOS source
        uses: actions/upload-artifact@v4
        with:
          name: Wafferli-iOS-Source
          path: ios/Wafferli-iOS-Source.zip
          if-no-files-found: error
