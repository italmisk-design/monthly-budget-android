name: Build Wafferli v15 iOS

on:
  push:
    branches: [ "v15-auto-merge-sync-2" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply monthly confirmation patch
        run: python3 tools/patch_monthly_confirm.py
      - name: Apply monthly funding patch
        run: python3 tools/patch_monthly_funding.py
      - name: Apply monthly transfer patch
        run: python3 tools/patch_monthly_transfer.py
      - name: Improve category manager
        run: python3 tools/patch_category_manager.py
      - name: Add transaction filters
        run: python3 tools/patch_transaction_filters.py
      - name: Add balance sheet
        run: python3 tools/patch_balance_sheet.py
      - name: Add balance sheet transfer details
        run: python3 tools/patch_balance_transfers.py
      - name: Apply Wafferli logo UI
        run: python3 tools/patch_logo.py
      - name: Apply Wafferli brand name
        run: python3 tools/patch_brand_name.py
      - name: Make General Wallet real
        run: python3 tools/patch_real_general_wallet.py
      - name: Apply primary wallet hierarchy
        run: python3 tools/patch_primary_wallet_hierarchy.py
      - name: Apply full-screen safe area
        run: python3 tools/patch_safe_area.py
      - name: Add Google sync and native backup UI
        run: python3 tools/patch_google_drive.py
      - name: Add iOS native file picker
        run: python3 tools/patch_ios_native_backup.py

      - name: Apply v15 auto merge sync
        run: |
          cat tools/v15_patch_parts/part*.txt > /tmp/v15.patch
          git apply --include='app/src/main/assets/index.html' --include='ios/**' /tmp/v15.patch

      - name: Prepare iOS web assets
        run: |
          rm -rf ios/Tofeeri/WebAssets
          mkdir -p ios/Tofeeri/WebAssets
          cp -R app/src/main/assets/. ios/Tofeeri/WebAssets/

      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('ios/Tofeeri/WebAssets/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('inline script missing')
          Path('/tmp/wafferli-ios.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/wafferli-ios.js
          node --check ios/Tofeeri/WebAssets/primary_wallet.js

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios
          xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          cd ios
          xcodebuild -project Tofeeri.xcodeproj -scheme Tofeeri -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package unsigned IPA
        run: |
          cd ios
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Tofeeri.app Payload/
          zip -qry Wafferli-v15-iOS-Unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wafferli-v15-iOS-Unsigned
          path: ios/Wafferli-v15-iOS-Unsigned.ipa
          if-no-files-found: error
