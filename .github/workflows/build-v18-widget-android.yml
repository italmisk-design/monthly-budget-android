name: Build Wafferli v18 Widget Android

on:
  push:
    branches: [ "v18-global-currencies" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild v17 baseline features
        run: |
          python tools/patch_monthly_confirm.py
          python tools/patch_monthly_funding.py
          python tools/patch_monthly_transfer.py
          python tools/patch_category_manager.py
          python tools/patch_transaction_filters.py
          python tools/patch_balance_sheet.py
          python tools/patch_balance_transfers.py
          python tools/patch_logo.py
          python tools/patch_brand_name.py
          python tools/patch_real_general_wallet.py
          python tools/patch_primary_wallet_hierarchy.py
          python tools/patch_safe_area.py
          python tools/patch_google_drive.py
          cat tools/v15_patch_parts/part*.txt > /tmp/v15.patch
          git apply --include='app/**' /tmp/v15.patch
          python tools/patch_tutorial_v16.py

      - name: Add v18 quick widget only
        run: python tools/patch_widget_v18.py

      - name: Validate v17 tutorial and v18 widget
        run: |
          grep -q "12 خطوة" app/src/main/assets/tutorial.js
          grep -q "WafferliQuickWidget" app/src/main/AndroidManifest.xml
          grep -q "wafferli_quick_action" app/src/main/java/com/monthlybudget/app/WafferliQuickWidget.java
          grep -q "widgetIncome" app/src/main/res/layout/wafferli_quick_widget.xml
          grep -q "widgetExpense" app/src/main/res/layout/wafferli_quick_widget.xml
          python - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/tutorial.js').read_text(encoding='utf-8')
          a=s.index('const tutorialSteps=['); b=s.index('];',a)
          n=s[a:b].count('title:')
          print('tutorial steps:',n)
          if n != 12: raise SystemExit('tutorial must contain exactly 12 steps')
          j=Path('app/src/main/java/com/monthlybudget/app/MainActivity.java').read_text(encoding='utf-8')
          for x in ('handleQuickActionIntent','dispatchQuickAction','onNewIntent'):
              if x not in j: raise SystemExit('missing '+x)
          PY
          node --check app/src/main/assets/tutorial.js
          node --check app/src/main/assets/primary_wallet.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        env:
          WAFFERLI_VERSION_CODE: 89
          WAFFERLI_VERSION_NAME: 1.8.0
        run: gradle assembleRelease --stacktrace

      - name: Verify packaged widget
        run: |
          unzip -l app/build/outputs/apk/release/app-release-unsigned.apk | grep -q "res/"
          unzip -p app/build/outputs/apk/release/app-release-unsigned.apk AndroidManifest.xml >/tmp/AndroidManifest.bin
          test -s /tmp/AndroidManifest.bin

      - name: Prepare artifact
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk Wafferli_v18_Widget_Android_Unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wafferli-v18-Widget-Android
          path: Wafferli_v18_Widget_Android_Unsigned.apk
          if-no-files-found: error
