name: Build Wafferli v16 Android

on:
  push:
    branches: [ "v16-training" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply monthly confirmation patch
        run: python tools/patch_monthly_confirm.py
      - name: Apply monthly funding patch
        run: python tools/patch_monthly_funding.py
      - name: Apply monthly transfer patch
        run: python tools/patch_monthly_transfer.py
      - name: Improve category manager
        run: python tools/patch_category_manager.py
      - name: Add transaction filters
        run: python tools/patch_transaction_filters.py
      - name: Add balance sheet
        run: python tools/patch_balance_sheet.py
      - name: Add balance sheet transfer details
        run: python tools/patch_balance_transfers.py
      - name: Apply Wafferli logo UI
        run: python tools/patch_logo.py
      - name: Apply Wafferli brand name
        run: python tools/patch_brand_name.py
      - name: Make General Wallet real
        run: python tools/patch_real_general_wallet.py
      - name: Apply primary wallet hierarchy
        run: python tools/patch_primary_wallet_hierarchy.py
      - name: Apply full-screen safe area
        run: python tools/patch_safe_area.py
      - name: Add Google sync and native backup UI
        run: python tools/patch_google_drive.py

      - name: Apply v15 auto merge sync
        run: |
          cat tools/v15_patch_parts/part*.txt > /tmp/v15.patch
          git apply --include='app/**' /tmp/v15.patch

      - name: Add v16 12-step tutorial
        run: python tools/patch_tutorial_v16.py

      - name: Restore exact official logo
        run: |
          cat tools/v14_logo_exact_part_*.txt | base64 -d > app/src/main/assets/wafferli_logo.jpg
          cp app/src/main/assets/wafferli_logo.jpg app/src/main/res/drawable/wafferli_logo.jpg
          echo "6c436e9595c91f74622ae7f4460531e4db85bb5eb77984d68657e81e1ea79a09  app/src/main/assets/wafferli_logo.jpg" | sha256sum -c -
          echo "6c436e9595c91f74622ae7f4460531e4db85bb5eb77984d68657e81e1ea79a09  app/src/main/res/drawable/wafferli_logo.jpg" | sha256sum -c -

      - name: Validate tutorial and JavaScript
        run: |
          grep -q "12 خطوة" app/src/main/assets/tutorial.js
          grep -q "الحركات الشهرية" app/src/main/assets/tutorial.js
          grep -q "كشف الحركات" app/src/main/assets/tutorial.js
          grep -q "الكشف الكلي" app/src/main/assets/tutorial.js
          grep -q "تعديل" app/src/main/assets/tutorial.js
          python - <<'PY'
          from pathlib import Path
          s=Path('app/src/main/assets/tutorial.js').read_text(encoding='utf-8')
          a=s.index('const tutorialSteps=[')
          b=s.index('];', a)
          n=s[a:b].count('title:')
          print('tutorial steps:', n)
          if n != 12: raise SystemExit('tutorial must contain exactly 12 steps')
          html=Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          if '<script src="tutorial.js"></script>' not in html: raise SystemExit('tutorial script not loaded')
          if 'tutorialSettingsRow' not in html: raise SystemExit('tutorial settings row missing')
          PY
          node --check app/src/main/assets/tutorial.js
          node --check app/src/main/assets/primary_wallet.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        env:
          WAFFERLI_VERSION_CODE: 88
          WAFFERLI_VERSION_NAME: 1.6.1
        run: gradle assembleRelease --stacktrace

      - name: Verify packaged tutorial and logo
        run: |
          unzip -p app/build/outputs/apk/release/app-release-unsigned.apk assets/tutorial.js > /tmp/tutorial.js
          grep -q "12 خطوة" /tmp/tutorial.js
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/tutorial.js').read_text(encoding='utf-8')
          a=s.index('const tutorialSteps=['); b=s.index('];',a)
          n=s[a:b].count('title:')
          print('PACKAGED tutorial steps:',n)
          if n != 12: raise SystemExit('packaged APK does not have 12 steps')
          PY
          unzip -p app/build/outputs/apk/release/app-release-unsigned.apk assets/wafferli_logo.jpg > /tmp/logo.jpg
          echo "6c436e9595c91f74622ae7f4460531e4db85bb5eb77984d68657e81e1ea79a09  /tmp/logo.jpg" | sha256sum -c -

      - name: Prepare APK artifact
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk Wafferli-v16.1-12Step-Unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wafferli-v16.1-12Step-Unsigned-APK
          path: Wafferli-v16.1-12Step-Unsigned.apk
          if-no-files-found: error
