name: Build Wafferli v19

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project
        run: python tools/verify_project.py

      - name: Validate JavaScript
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/sync.js
          node --check app/src/main/assets/primary_wallet.js
          node --check app/src/main/assets/tutorial.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare permanent signing key
        env:
          WAFFERLI_KEYSTORE_B64: ${{ secrets.WAFFERLI_KEYSTORE_B64 }}
          WAFFERLI_STORE_PASSWORD: ${{ secrets.WAFFERLI_STORE_PASSWORD }}
          WAFFERLI_KEY_PASSWORD: ${{ secrets.WAFFERLI_KEY_PASSWORD }}
          WAFFERLI_KEY_ALIAS: ${{ secrets.WAFFERLI_KEY_ALIAS }}
        run: |
          test -n "$WAFFERLI_KEYSTORE_B64"
          test -n "$WAFFERLI_STORE_PASSWORD"
          test -n "$WAFFERLI_KEY_PASSWORD"
          test -n "$WAFFERLI_KEY_ALIAS"
          printf '%s' "$WAFFERLI_KEYSTORE_B64" | base64 --decode > app/wafferli-release.jks

      - name: Build signed APK
        env:
          WAFFERLI_KEYSTORE_PATH: wafferli-release.jks
          WAFFERLI_STORE_PASSWORD: ${{ secrets.WAFFERLI_STORE_PASSWORD }}
          WAFFERLI_KEY_PASSWORD: ${{ secrets.WAFFERLI_KEY_PASSWORD }}
          WAFFERLI_KEY_ALIAS: ${{ secrets.WAFFERLI_KEY_ALIAS }}
          WAFFERLI_VERSION_CODE: 190
          WAFFERLI_VERSION_NAME: 1.9.0
        run: gradle assembleRelease --stacktrace

      - name: Package deliverables
        run: |
          cp app/build/outputs/apk/release/app-release.apk Wafferli_v19_Minimal_Widget_Android.apk
          zip -qr Wafferli_v19_Minimal_Widget_Android_Source.zip . \
            -x '.git/*' \
            -x '.gradle/*' \
            -x 'app/build/*' \
            -x 'Wafferli_v19_Minimal_Widget_Android.apk' \
            -x 'Wafferli_v19_Minimal_Widget_Android_Source.zip'

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: Wafferli-v19-Minimal-Widget
          path: |
            Wafferli_v19_Minimal_Widget_Android.apk
            Wafferli_v19_Minimal_Widget_Android_Source.zip
          if-no-files-found: error
