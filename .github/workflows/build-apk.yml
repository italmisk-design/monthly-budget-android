name: Build Tofeeri APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply monthly confirmation patch
        run: python tools/patch_monthly_confirm.py

      - name: Apply monthly funding patch
        run: python tools/patch_monthly_funding.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Tofeeri.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tofeeri-APK
          path: Tofeeri.apk
          if-no-files-found: error
