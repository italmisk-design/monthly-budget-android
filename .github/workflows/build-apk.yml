name: Build Wafferli APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply monthly confirmation patch
        run: python tools/patch_monthly_confirm.py

      - name: Apply monthly funding patch
        run: python tools/patch_monthly_funding.py

      - name: Apply monthly transfer patch
        run: python tools/patch_monthly_transfer.py

      - name: Improve category manager
        run: python tools/patch_category_manager.py

      - name: Add transaction filters
        run: python tools/patch_transaction_filters.py

      - name: Apply Wafferli logo
        run: python tools/patch_logo.py

      - name: Apply Wafferli brand name
        run: python tools/patch_brand_name.py

      - name: Validate patched JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('app/src/main/assets/index.html').read_text(encoding='utf-8')
          m = re.search(r'<script>(.*)</script>', s, re.S)
          if not m:
              raise SystemExit('Inline script not found')
          Path('/tmp/wafferli-app.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/wafferli-app.js

      - name: Create matching Android source ZIP
        run: |
          zip -qr Wafferli-Android-Source.zip . \
            -x '.git/*' \
            -x 'ios/*' \
            -x '.github/workflows/build-ios.yml' \
            -x 'app/build/*' \
            -x 'Wafferli-Android.apk' \
            -x 'Wafferli-Android-Source.zip'

      - name: Upload Android source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Wafferli-Android-Source
          path: Wafferli-Android-Source.zip
          if-no-files-found: error

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Wafferli-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wafferli-Android-APK
          path: Wafferli-Android.apk
          if-no-files-found: error
