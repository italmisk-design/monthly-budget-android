name: Build Wafferli v18 Android Widget

on:
  push:
    branches: [ "v18-widget-only" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply monthly confirmation patch
        run: python tools/patch_monthly_confirm.py
      - name: Apply monthly funding patch
        run: python tools/patch_monthly_funding.py
      - name: Apply monthly transfer patch
        run: python tools/patch_monthly_transfer.py
      - name: Improve category manager
        run: python tools/patch_category_manager.py
      - name: Add transaction filters
        run: python tools/patch_transaction_filters.py
      - name: Add balance sheet
        run: python tools/patch_balance_sheet.py
      - name: Add balance sheet transfer details
        run: python tools/patch_balance_transfers.py
      - name: Apply Wafferli logo UI
        run: python tools/patch_logo.py
      - name: Apply Wafferli brand name
        run: python tools/patch_brand_name.py
      - name: Make General Wallet real
        run: python tools/patch_real_general_wallet.py
      - name: Apply primary wallet hierarchy
        run: python tools/patch_primary_wallet_hierarchy.py
      - name: Apply full-screen safe area
        run: python tools/patch_safe_area.py
      - name: Add Google sync and native backup UI
        run: python tools/patch_google_drive.py
      - name: Apply v15 auto merge sync
        run: |
          cat tools/v15_patch_parts/part*.txt > /tmp/v15.patch
          git apply --include='app/**' /tmp/v15.patch
      - name: Add v16 12-step tutorial
        run: python tools/patch_tutorial_v16.py
      - name: Add v18 quick-add widget
        run: python tools/patch_widget_v18.py

      - name: Validate widget and tutorial
        run: |
          grep -q "QuickAddWidget" app/src/main/AndroidManifest.xml
          grep -q "pendingQuickAddType" app/src/main/java/com/monthlybudget/app/MainActivity.java
          grep -q "widgetIncome" app/src/main/res/layout/widget_quick_add.xml
          grep -q "12 خطوة" app/src/main/assets/tutorial.js
          node --check app/src/main/assets/tutorial.js
          node --check app/src/main/assets/primary_wallet.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        env:
          WAFFERLI_VERSION_CODE: 90
          WAFFERLI_VERSION_NAME: 1.8.0
        run: gradle assembleRelease --stacktrace

      - name: Verify packaged app
        run: |
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -p app/build/outputs/apk/release/app-release-unsigned.apk assets/tutorial.js > /tmp/tutorial.js
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/tutorial.js').read_text(encoding='utf-8')
          a=s.index('const tutorialSteps=['); b=s.index('];',a)
          if s[a:b].count('title:') != 12: raise SystemExit('tutorial count changed')
          PY

      - name: Prepare artifacts
        run: |
          mkdir -p dist/source
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Wafferli_v18_Widget_Android_Unsigned.apk
          cp -R app build.gradle gradle.properties settings.gradle dist/source/
          cd dist/source
          zip -qry ../Wafferli_v18_Widget_Android_Source.zip .

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wafferli-v18-Widget-Android
          path: |
            dist/Wafferli_v18_Widget_Android_Unsigned.apk
            dist/Wafferli_v18_Widget_Android_Source.zip
          if-no-files-found: error
