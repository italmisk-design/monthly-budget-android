name: Build Wafferli v19

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project
        run: python tools/verify_project.py

      - name: Validate JavaScript
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/sync.js
          node --check app/src/main/assets/primary_wallet.js
          node --check app/src/main/assets/tutorial.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Package deliverables
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Wafferli_v19_Minimal_Widget_Android.apk
          zip -qr Wafferli_v19_Minimal_Widget_Android_Source.zip . \
            -x '.git/*' \
            -x '.gradle/*' \
            -x 'app/build/*' \
            -x 'Wafferli_v19_Minimal_Widget_Android.apk' \
            -x 'Wafferli_v19_Minimal_Widget_Android_Source.zip'

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: Wafferli-v19-Minimal-Widget
          path: |
            Wafferli_v19_Minimal_Widget_Android.apk
            Wafferli_v19_Minimal_Widget_Android_Source.zip
          if-no-files-found: error
