name: Build Wafferli v13 Signer

on:
  push:
    branches: [ "v13-google-sync-build" ]
  workflow_dispatch:

jobs:
  signer:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Package apksigner
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -f "$BT/apksigner"
          test -f "$BT/lib/apksigner.jar"
          mkdir -p Wafferli-ApkSigner/lib
          cp "$BT/apksigner" Wafferli-ApkSigner/
          cp "$BT/lib/apksigner.jar" Wafferli-ApkSigner/lib/
          zip -qr Wafferli-ApkSigner.zip Wafferli-ApkSigner

      - name: Upload apksigner
        uses: actions/upload-artifact@v4
        with:
          name: Wafferli-ApkSigner
          path: Wafferli-ApkSigner.zip
          if-no-files-found: error
